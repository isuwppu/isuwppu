<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Tetris</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><section class="game-card"><header><div><p class="eyebrow">CLASSIC ARCADE</p><h1>Tetris</h1></div><button id="pauseBtn" class="secondary-btn">Pause</button></header><div class="game-layout"><div class="board-wrap"><canvas id="game" width="300" height="600"></canvas><div id="overlay" class="overlay hidden"><h2 id="overlayTitle">Paused</h2><p id="overlayText">Press P or Resume to continue.</p><button id="overlayBtn">Resume</button></div></div><aside class="sidebar"><div class="panel"><span>Next</span><canvas id="next" width="120" height="120"></canvas></div><div class="stats"><div><span>Score</span><strong id="score">0</strong></div><div><span>Level</span><strong id="level">1</strong></div><div><span>Lines</span><strong id="lines">0</strong></div></div><div class="controls"><h3>Controls</h3><p>← → Move</p><p>↓ Soft drop</p><p>↑ Rotate</p><p>Space Hard drop</p><p>P Pause</p><button id="restartBtn" class="primary-btn">Restart</button></div></aside></div><div class="mobile-controls"><button data-action="left">←</button><button data-action="rotate">↻</button><button data-action="down">↓</button><button data-action="right">→</button><button data-action="drop">⤓</button></div></section></main><script src="script.js"></script></body></html>
